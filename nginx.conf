events {
  worker_connections 4096;
}

http {
  upstream app_pool {
    # least_conn spreads requests toward instances with fewer in-flight
    # requests, which handles uneven request cost better than round-robin.
    least_conn;
    server app:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
